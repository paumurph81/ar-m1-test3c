<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANDROID REFRESH - M1 test 3c</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 20px/1.4 Roboto, Arial, sans-serif; }
  body { box-sizing: border-box; border: 4px solid #1b7f3a; padding: 16px; }
  h1 { margin: 0 0 12px; font-size: 28px; background: #1b7f3a; padding: 10px; text-align: center; }
  table { border-collapse: collapse; }
  td { border: 1px solid #444; padding: 6px 12px; }
  .bad { color: #ff8a80; } .good { color: #9be7a4; }
  #corner { position: fixed; right: 0; bottom: 0; background: #1b7f3a; padding: 2px 8px; font-size: 14px; }
</style>
</head>
<body>
<h1>M1 TEST 3c - PLAIN PAGE + DATA FEED</h1>
<p>Temporary diagnostic. Sample text only, no personal data. The green border should touch all four screen edges.</p>
<table>
  <tr><td>Page loaded at</td><td id="loaded"></td></tr>
  <tr><td>Screen area (CSS px)</td><td id="size"></td></tr>
  <tr><td>Pixel ratio</td><td id="ratio"></td></tr>
  <tr><td>Feed result</td><td id="feed">waiting...</td></tr>
  <tr><td>Feed time</td><td id="ftime">-</td></tr>
  <tr><td>Reloads this session</td><td id="reloads"></td></tr>
</table>
<div id="corner">bottom-right corner</div>
<script>
  // Feed address is not secret. The key comes from this page's #k= part, set only in the tablet's start link.
  var FEED = 'https://script.google.com/macros/s/AKfycbw3Xfvxx5ath0uiFszl5w4pyfnHXb4QLJcQ_Ohfs5swbFkwQkTJ_q8JJqcP6Op7wIGxmw/exec';
  function show() {
    document.getElementById('size').textContent = window.innerWidth + ' x ' + window.innerHeight;
    document.getElementById('ratio').textContent = window.devicePixelRatio;
  }
  document.getElementById('loaded').textContent = new Date().toLocaleString('en-IE');
  var n = 0;
  try { n = Number(sessionStorage.getItem('r') || 0) + 1; sessionStorage.setItem('r', n); } catch (e) { n = 'n/a'; }
  document.getElementById('reloads').textContent = n;
  show(); window.addEventListener('resize', show);
  var m = location.hash.match(/k=([^&]+)/);
  var feedCell = document.getElementById('feed');
  if (!m) {
    feedCell.textContent = 'no key in link'; feedCell.className = 'bad';
  } else {
    fetch(FEED + '?k=' + encodeURIComponent(m[1]))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.ok) { feedCell.textContent = d.sample; feedCell.className = 'good'; document.getElementById('ftime').textContent = d.served; }
        else { feedCell.textContent = 'feed refused: ' + d.error; feedCell.className = 'bad'; }
      })
      .catch(function (e) { feedCell.textContent = 'feed error: ' + e; feedCell.className = 'bad'; });
  }
</script>
</body>
</html>
